<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đổi mật khẩu | Quản lý học sinh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4" style="max-width: 680px">
    <header class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">
        <a class="text-decoration-none fw-semibold" th:href="@{/}">Quản lý học sinh</a>
        <form th:action="@{/logout}" method="post"><button class="btn btn-outline-secondary btn-sm" type="submit">Đăng xuất</button></form>
    </header>
    <h1 class="h3 mb-4">Đổi mật khẩu</h1>
    <div class="alert alert-danger" th:if="${loi}" th:text="${loi}"></div>
    <div class="alert alert-success" th:if="${thongBao}" th:text="${thongBao}"></div>
    <form th:action="@{/doi-mat-khau}" method="post" class="bg-white border rounded-2 p-4">
        <div class="mb-3"><label for="matKhauCu" class="form-label">Mật khẩu hiện tại</label><input id="matKhauCu" name="matKhauCu" type="password" class="form-control" autocomplete="current-password" required></div>
        <div class="mb-3"><label for="matKhauMoi" class="form-label">Mật khẩu mới</label><input id="matKhauMoi" name="matKhauMoi" type="password" minlength="8" class="form-control" autocomplete="new-password" required></div>
        <div class="mb-4"><label for="xacNhanMatKhau" class="form-label">Xác nhận mật khẩu mới</label><input id="xacNhanMatKhau" name="xacNhanMatKhau" type="password" minlength="8" class="form-control" autocomplete="new-password" required></div>
        <button class="btn btn-primary" type="submit">Cập nhật mật khẩu</button>
    </form>
</main>
</body>
</html>
