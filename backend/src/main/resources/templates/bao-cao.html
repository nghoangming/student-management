<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Báo cáo tổng kết</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; color: #222; }
        h1 { margin-bottom: .25rem; }
        .cards { display: flex; flex-wrap: wrap; gap: 1rem; margin: 1.5rem 0; }
        .card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; min-width: 180px; }
        .number { font-size: 2rem; font-weight: bold; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: .7rem; text-align: left; }
        th { background: #f3f4f6; }
        .error { color: #b42318; }
    </style>
</head>
<body>
<main>
    <h1>Báo cáo tổng kết</h1>
    <p>Thống kê số lượng học sinh và phân bố theo lớp.</p>
    <div class="cards">
        <section class="card"><div>Tổng số học sinh</div><div class="number" id="tongHocSinh">—</div></section>
        <section class="card"><div>Tổng số lớp</div><div class="number" id="tongLop">—</div></section>
    </div>
    <p id="thongBao" role="status">Đang tải dữ liệu...</p>
    <table>
        <thead><tr><th>Mã lớp</th><th>Tên lớp</th><th>Số học sinh</th></tr></thead>
        <tbody id="bangLop"></tbody>
    </table>
</main>
<script>
(async function () {
    const thongBao = document.getElementById('thongBao');
    try {
        const response = await fetch('/api/bao-cao/tong-ket');
        if (!response.ok) throw new Error('Máy chủ trả về mã ' + response.status);
        const data = await response.json();
        document.getElementById('tongHocSinh').textContent = data.tongSoHocSinh;
        document.getElementById('tongLop').textContent = data.tongSoLop;
        const tbody = document.getElementById('bangLop');
        data.thongKeTheoLop.forEach(item => {
            const row = document.createElement('tr');
            [item.maLop ?? '—', item.tenLop || 'Chưa đặt tên', item.soHocSinh].forEach(value => {
                const cell = document.createElement('td');
                cell.textContent = value;
                row.appendChild(cell);
            });
            tbody.appendChild(row);
        });
        thongBao.textContent = 'Đã tải dữ liệu báo cáo.';
    } catch (error) {
        thongBao.className = 'error';
        thongBao.textContent = 'Không tải được báo cáo. Kiểm tra backend và endpoint /api/bao-cao/tong-ket.';
    }
})();
</script>
</body>
</html>
