<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập | Quản lý học sinh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <section class="bg-white border rounded-2 p-4 p-md-5 shadow-sm" style="width: min(100%, 420px)">
        <h1 class="h3 mb-1">Quản lý học sinh</h1>
        <p class="text-secondary mb-4">Đăng nhập vào hệ thống</p>
        <div class="alert alert-danger" role="alert" th:if="${param.loi}">Tên đăng nhập hoặc mật khẩu không đúng, hoặc tài khoản đã bị khóa.</div>
        <div class="alert alert-success" role="alert" th:if="${param.da-dang-xuat}">Bạn đã đăng xuất.</div>
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Tên đăng nhập</label>
                <input id="username" name="username" class="form-control" autocomplete="username" required autofocus>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Mật khẩu</label>
                <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
            </div>
            <button class="btn btn-primary w-100" type="submit">Đăng nhập</button>
        </form>
    </section>
</main>
</body>
</html>
