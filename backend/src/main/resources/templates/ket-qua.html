<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Tra cứu Kết Quả (MH06)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="mb-4 text-success">Màn hình Tra cứu Kết Quả (MH06)</h1>
        
        <form th:action="@{/ket-qua/tra-cuu}" method="get" class="d-flex mb-4">
            <input type="number" name="maHocSinh" class="form-control me-2" placeholder="Nhập mã học sinh..." required>
            <button type="submit" class="btn btn-success">Tra Cứu</button>
        </form>

        <div class="alert alert-info" th:if="${message != null}" th:text="${message}"></div>

        <table class="table table-bordered table-striped bg-white">
            <thead class="table-dark">
                <tr>
                    <th>Môn Học</th>
                    <th>Điểm 15 Phút</th>
                    <th>Điểm 1 Tiết</th>
                    <th>Điểm Thi</th>
                    <th>Điểm TB Môn</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td colspan="5" class="text-center text-muted">Vui lòng nhập mã học sinh để xem chi tiết...</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
