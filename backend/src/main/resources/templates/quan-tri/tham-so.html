<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tham số hệ thống | Quản lý học sinh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4">
    <header class="d-flex flex-wrap justify-content-between align-items-center gap-3 border-bottom pb-3 mb-4">
        <a class="text-decoration-none fw-semibold" th:href="@{/}">Quản lý học sinh</a>
        <nav class="d-flex align-items-center gap-3"><a th:href="@{/quan-tri/tai-khoan}" class="link-secondary">Tài khoản</a><a th:href="@{/quan-tri/tham-so}" class="link-primary">Tham số</a><a th:href="@{/doi-mat-khau}" class="link-secondary">Đổi mật khẩu</a><form th:action="@{/logout}" method="post"><button class="btn btn-outline-secondary btn-sm" type="submit">Đăng xuất</button></form></nav>
    </header>
    <div class="mb-3"><h1 class="h3 mb-1">Tham số hệ thống</h1><p class="text-secondary mb-0">Các giá trị dùng chung trong quy tắc quản lý học sinh</p></div>
    <div class="alert alert-danger" th:if="${loi}" th:text="${loi}"></div>
    <div class="alert alert-success" th:if="${thongBao}" th:text="${thongBao}"></div>
    <section class="bg-white border rounded-2 p-3 p-md-4 mb-4">
        <h2 class="h5 mb-3">Thêm hoặc cập nhật</h2>
        <form th:action="@{/quan-tri/tham-so}" method="post" class="row g-3">
            <div class="col-md-2"><label for="maThamSo" class="form-label">Mã</label><input class="form-control" id="maThamSo" name="maThamSo" maxlength="60" pattern="[A-Za-z][A-Za-z0-9_.-]{1,59}" required></div>
            <div class="col-md-3"><label for="tenThamSo" class="form-label">Tên tham số</label><input class="form-control" id="tenThamSo" name="tenThamSo" maxlength="120" required></div>
            <div class="col-md-2"><label for="giaTri" class="form-label">Giá trị</label><input class="form-control" id="giaTri" name="giaTri" maxlength="500" required></div>
            <div class="col-md-4"><label for="moTa" class="form-label">Mô tả</label><input class="form-control" id="moTa" name="moTa" maxlength="500"></div>
            <div class="col-md-1 d-flex align-items-end"><button class="btn btn-primary w-100" type="submit" aria-label="Lưu tham số">+</button></div>
        </form>
    </section>
    <div class="table-responsive bg-white border rounded-2">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light"><tr><th>Mã</th><th>Tên</th><th>Giá trị</th><th>Mô tả</th><th>Cập nhật</th><th></th></tr></thead>
            <tbody>
            <tr th:each="ts : ${thamSos}">
                <td class="font-monospace" th:text="${ts.maThamSo}"></td><td th:text="${ts.tenThamSo}"></td><td><span class="badge text-bg-secondary" th:text="${ts.giaTri}"></span></td><td th:text="${ts.moTa}"></td><td class="small text-secondary" th:text="${#temporals.format(ts.ngayCapNhat, 'dd/MM/yyyy HH:mm')}"></td><td><form th:action="@{/quan-tri/tham-so/{ma}/xoa(ma=${ts.maThamSo})}" method="post" onsubmit="return confirm('Xóa tham số này?')"><button class="btn btn-sm btn-outline-danger" type="submit">Xóa</button></form></td>
            </tr>
            <tr th:if="${#lists.isEmpty(thamSos)}"><td colspan="6" class="text-center text-secondary py-4">Chưa có tham số.</td></tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
