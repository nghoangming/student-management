<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý tài khoản | Quản lý học sinh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4">
    <header class="d-flex flex-wrap justify-content-between align-items-center gap-3 border-bottom pb-3 mb-4">
        <a class="text-decoration-none fw-semibold" th:href="@{/}">Quản lý học sinh</a>
        <nav class="d-flex align-items-center gap-3"><a th:href="@{/quan-tri/tai-khoan}" class="link-primary">Tài khoản</a><a th:href="@{/quan-tri/tham-so}" class="link-secondary">Tham số</a><a th:href="@{/doi-mat-khau}" class="link-secondary">Đổi mật khẩu</a><form th:action="@{/logout}" method="post"><button class="btn btn-outline-secondary btn-sm" type="submit">Đăng xuất</button></form></nav>
    </header>
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-3"><div><h1 class="h3 mb-1">Tài khoản</h1><p class="text-secondary mb-0">Quản lý đăng nhập và vai trò người dùng</p></div><span class="small text-secondary" th:text="${tenDangNhapHienTai}"></span></div>
    <div class="alert alert-danger" th:if="${loi}" th:text="${loi}"></div>
    <div class="alert alert-success" th:if="${thongBao}" th:text="${thongBao}"></div>
    <section class="bg-white border rounded-2 p-3 p-md-4 mb-4">
        <h2 class="h5 mb-3">Tạo tài khoản</h2>
        <form th:action="@{/quan-tri/tai-khoan}" method="post" class="row g-3">
            <div class="col-md-3"><label class="form-label" for="tenDangNhap">Tên đăng nhập</label><input class="form-control" id="tenDangNhap" name="tenDangNhap" maxlength="50" required></div>
            <div class="col-md-3"><label class="form-label" for="hoTen">Họ tên</label><input class="form-control" id="hoTen" name="hoTen" maxlength="100" required></div>
            <div class="col-md-2"><label class="form-label" for="vaiTro">Vai trò</label><select class="form-select" id="vaiTro" name="vaiTro"><option value="GIAO_VIEN">Giáo viên</option><option value="CAN_BO">Cán bộ</option><option value="ADMIN">Quản trị</option></select></div>
            <div class="col-md-3"><label class="form-label" for="matKhau">Mật khẩu tạm</label><input class="form-control" id="matKhau" name="matKhau" type="password" minlength="8" autocomplete="new-password" required></div>
            <div class="col-md-1 d-flex align-items-end"><button class="btn btn-primary w-100" type="submit" aria-label="Tạo tài khoản">+</button></div>
        </form>
    </section>
    <div class="table-responsive bg-white border rounded-2">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light"><tr><th>Tên đăng nhập</th><th>Họ tên</th><th>Vai trò</th><th>Trạng thái</th><th>Cập nhật</th><th>Thao tác</th></tr></thead>
            <tbody>
            <tr th:each="tk : ${taiKhoans}">
                <td><strong th:text="${tk.tenDangNhap}"></strong></td>
                <td><form th:id="|tk-${tk.id}|" th:action="@{/quan-tri/tai-khoan/{id}(id=${tk.id})}" method="post"></form><input form="tk-${tk.id}" name="hoTen" class="form-control form-control-sm" maxlength="100" th:value="${tk.hoTen}" required></td>
                <td><select form="tk-${tk.id}" name="vaiTro" class="form-select form-select-sm"><option value="ADMIN" th:selected="${tk.vaiTro == 'ADMIN'}">Quản trị</option><option value="GIAO_VIEN" th:selected="${tk.vaiTro == 'GIAO_VIEN'}">Giáo viên</option><option value="CAN_BO" th:selected="${tk.vaiTro == 'CAN_BO'}">Cán bộ</option></select></td>
                <td><div class="form-check"><input form="tk-${tk.id}" class="form-check-input" type="checkbox" name="kichHoat" value="true" th:checked="${tk.kichHoat}" th:disabled="${tk.tenDangNhap == tenDangNhapHienTai}" th:id="|active-${tk.id}|"><label class="form-check-label" th:for="|active-${tk.id}|" th:text="${tk.kichHoat ? 'Hoạt động' : 'Đã khóa'}"></label></div></td>
                <td class="small text-secondary" th:text="${#temporals.format(tk.ngayCapNhat, 'dd/MM/yyyy HH:mm')}"></td>
                <td><div class="d-flex flex-wrap gap-2"><button form="tk-${tk.id}" class="btn btn-sm btn-outline-primary" type="submit">Lưu</button><form th:action="@{/quan-tri/tai-khoan/{id}/mat-khau(id=${tk.id})}" method="post" class="d-flex gap-1"><input class="form-control form-control-sm" type="password" name="matKhauMoi" minlength="8" placeholder="Mật khẩu mới" aria-label="Mật khẩu mới" required><button class="btn btn-sm btn-outline-secondary" type="submit">Đặt lại</button></form><form th:action="@{/quan-tri/tai-khoan/{id}/xoa(id=${tk.id})}" method="post" onsubmit="return confirm('Xóa tài khoản này?')"><button class="btn btn-sm btn-outline-danger" type="submit" th:disabled="${tk.tenDangNhap == tenDangNhapHienTai}">Xóa</button></form></div></td>
            </tr>
            <tr th:if="${#lists.isEmpty(taiKhoans)}"><td colspan="6" class="text-center text-secondary py-4">Chưa có tài khoản.</td></tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
